<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Imput</title>
</head>
<body>
    <form action="/INDEX.HTML">
        <label for="Nombre">Nombre:</label><br>
        <input type="text" id="Nombre" name="fname"><br>
        <label for="Apellido">Apellido:</label><br>
        <input type="text" id="Apellido" name="Apellido"><br><br>
        <input type="submit" value="Subir">
        <input type="reset" value="Reiniciar">
      </form>
      <hr>

      <p>Cual es tu juego favorito</p>

      <form>
        <input type="radio" id="GTA" name="Juego_fav" value="GTA">
        <label for="GTA">GTA</label><br>
        <input type="radio" id="GOW" name="Juego_fav" value="GOW">
        <label for="GOW">GOW</label><br>
        <input type="radio" id="HALo" name="Juego_fav" value="HALO">
        <label for="HALO">HALO</label>
      </form>
      <hr>

      <form>
        ¿A que alimentos eres alergicos? <br><br>
        <input type="checkbox" id="alimento1" name="alimento1" value="Nueces">
        <label for="alimento1"> Nueces</label><br>
        <input type="checkbox" id="alimento2" name="alimento2" value="Melocoton">
        <label for="alimento2"> Melocoton</label><br>
        <input type="checkbox" id="alimento3" name="alimento3" value="Marisco">
        <label for="alimento3"> Marisco</label>
      </form>
      <hr>

      <form>
        <label for="colorfav">Selecciona tu color favorito:</label>
        <input type="color" id="colorfav" name="colorfav">
      </form>
      <hr>

      <form>
        <label for="cumpleaños">cumpleaños:</label>
        <input type="date" id="cumpleaños" name="cumpleaños">
      </form>
      <hr>

      <form>
        <label for="cumpleaños-tiempo">Cumpleaños (fecha y tiempo):</label>
        <input type="datetime-local" id="cumpleaños-tiempo" name="cumpleaños-tiempo">
      </form>
      <hr>

      <form>
        <label for="email">Inserte su email:</label>
        <input type="email" id="email" name="email">
      </form>
      <hr>

      <form>
    <input type="image" src="img_submit.gif" alt="Submit" width="48" height="48">
    </form>
    <h1>Hola</h1>
</body>
</html>
